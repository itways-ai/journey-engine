# Engine-spoken text, English.
#
# These are only used when the journey author supplied nothing of their own.
# Authored step text wins wherever it exists; see journey_step_translations.
#
# {0}-style placeholders are java.text.MessageFormat arguments. Keep their
# order identical across every locale file — the argument index is the contract,
# not the position in the sentence.

step.userInput.waiting          = Waiting for input: {0}
step.userInput.confirm          = I have read your input. Please check the details below and confirm.
step.userInput.prefillConfirm    = Use “{0}”? Reply yes to go ahead, or no to choose something else.

# USER_INPUT validation. Apostrophes are avoided on purpose: these are rendered
# through MessageFormat when they carry arguments, where a lone quote escapes.
step.userInput.fixErrors        = Please check the following: {0}
step.userInput.empty            = I did not catch that. Could you answer the question?
step.userInput.tooManyAttempts  = I could not get a valid answer, so I have stopped here. Please start again or ask for help.

step.input.error.required       = This field is required.
step.input.error.email          = Enter a valid email address.
step.input.error.number         = Enter a number.
step.input.error.min            = Enter {0} or more.
step.input.error.max            = Enter {0} or less.
step.input.error.minLength      = Use at least {0} characters.
step.input.error.maxLength      = Use at most {0} characters.
step.input.error.pattern        = This does not match the expected format.
step.input.error.structured     = Please fill in and submit the form.

step.approval.prompt            = Please confirm to continue. Reply approve or reject.
step.approval.promptStakeholder = Awaiting approval from: {0}. Reply approve or reject.
step.approval.unclear           = I could not tell whether that was an approval. Please reply with approve or reject.
step.approval.rejected          = The request was rejected.
step.approval.timedOut          = The approval request expired and was automatically rejected.
step.approval.granted           = The request was approved.

# Accepted decision words. Comma-separated, lower case, no regex.
#
# Every locale's list is pooled, so a user may answer in any supported language
# regardless of the language the conversation is in. Keep the two lists disjoint
# within a locale and across them: a word in both is rejected at startup and
# stops counting as a decision at all.
step.approval.approveWords      = yes, y, ok, okay, approve, approved, confirm, confirmed, agree, agreed, accept, accepted, grant, granted, sure, true
step.approval.rejectWords       = no, n, nope, reject, rejected, deny, denied, decline, declined, disagree, refuse, refused, cancel, cancelled, false

step.knowledge.noAnswer         = I do not have information about this.

step.handoff.waiting            = Let me bring in a colleague who can help with this. Someone from our team will continue this conversation with you.

run.error.generic               = Something went wrong while handling your request. Please try again.
run.noSteps                     = This journey has no steps configured.
run.loopLimit                   = This request was stopped because it was repeating without making progress. Please try again or contact support.
run.versionGone                 = This conversation can no longer continue because the journey it was using has changed. Please start again.

# A form asked one field at a time, on a channel that has no form to show.
step.userInput.fieldOf          = {0} of {1}: what is the {2}?
step.userInput.fieldOptions     = The options are: {0}.
step.userInput.fileUnsupported  = This step needs a file, which cannot be sent on this channel.
step.apiCall.userRequired       = This needs you to be signed in and verified first.
